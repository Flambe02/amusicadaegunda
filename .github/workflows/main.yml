name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Create .env file for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}" >> .env
          echo "VITE_PUSH_API_BASE=${{ secrets.VITE_PUSH_API_BASE }}" >> .env
          echo "VITE_VAPID_KEY_VERSION=${{ secrets.VITE_VAPID_KEY_VERSION }}" >> .env
        shell: bash
        
      - name: Build application
        run: npm run deploy
        env:
          # Forcer un rebuild complet sans cache
          NODE_ENV: production
          CI: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Le site construit par cette CI — jamais un dossier commité.
          path: './dist'
          # Depuis la v4, les fichiers cachés sont écartés par défaut : sans ceci,
          # /.well-known/assetlinks.json n'est pas publié et les App Links Android
          # échouent à la vérification du domaine.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Après la mise en ligne : les adresses annoncées existent vraiment. Un refus
      # (ex. Bing 403 tant que le site n'est pas vérifié chez eux) marque CETTE étape en
      # échec avec une annotation, sans annuler le déploiement déjà fait.
      - name: IndexNow
        continue-on-error: true
        run: npm run indexnow


